# Per-install values. Keys here are THIS install's own facts, pinned
# explicitly: the app chart's defaults belong to whichever install it was
# authored against, and an omitted key inherits them silently.
# Sign-in goes through this install's estimatekit realm (granted in teams/estimatekit).
estimatekit:
  host: estimatekit.rb-foundry.com
  auth:
    oidc:
      enabled: true
      issuer: https://keycloak.rb-foundry.com/realms/estimatekit
      clientId: estimatekit
      existingSecret: keycloak-estimatekit
  images:
    app:
      repository: ghcr.io/foundryrb/estimatekit-app
      tag: 1.0.0
    docs:
      repository: ghcr.io/foundryrb/estimatekit-docs
      tag: 1.0.0
